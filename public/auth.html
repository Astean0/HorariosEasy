<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso | HorariosEasy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-page">
  <nav class="navbar border-bottom bg-white"><div class="container py-2"><a class="navbar-brand brand-lockup" href="/"><span class="brand-mark">H</span><span>Horarios<span class="text-primary">Easy</span></span></a></div></nav>
  <main class="container py-5">
    <div class="row justify-content-center"><div class="col-md-7 col-lg-5">
      <div class="auth-card p-4 p-md-5">
        <p class="eyebrow mb-2">Tu espacio académico</p>
        <h1 id="authTitle" class="h2 fw-semibold mb-2">Iniciar sesión</h1>
        <p id="authDescription" class="text-secondary mb-4">Ingresa para continuar a tu panel.</p>
        <div id="authAlert" class="alert d-none" role="alert"></div>
        <form id="authForm" novalidate>
          <div class="mb-3"><label class="form-label" for="email">Correo institucional</label><input class="form-control form-control-lg" id="email" name="email" type="email" autocomplete="email" required><div class="invalid-feedback">Ingresa un correo válido.</div></div>
          <div class="mb-3"><label class="form-label" for="password">Contraseña</label><input class="form-control form-control-lg" id="password" name="password" type="password" minlength="6" autocomplete="current-password" required><div class="invalid-feedback">Usa al menos 6 caracteres.</div></div>
          <button id="submitButton" class="btn btn-primary btn-lg w-100" type="submit">Ingresar</button>
        </form>
        <div class="d-flex justify-content-between mt-4 small"><button id="toggleMode" class="btn btn-link p-0 text-decoration-none" type="button">Crear una cuenta</button><button id="forgotPassword" class="btn btn-link p-0 text-decoration-none" type="button">¿Olvidaste tu contraseña?</button></div>
        <a class="d-block text-center small text-secondary mt-4" href="/">Volver al inicio</a>
      </div>
    </div></div>
  </main>
  <script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="/js/autenticacion.js"></script>
</body>
</html>
